name: Build MyChat v7.5 Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name shown on phone"
        required: true
        default: "MyChat"
        type: string
      app_package:
        description: "Base Android package (example: com.yourname.mychat)"
        required: true
        default: "com.example.mychat"
        type: string
      account_cap:
        description: "Client-side account slot cap (recommended 100)"
        required: true
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_PACKAGE: ${{ inputs.app_package }}
      ACCOUNT_CAP: ${{ inputs.account_cap }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout Telegram source + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found on GitHub runner"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate configuration
        shell: python
        run: |
          import os, re, sys

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()
          app_package = os.environ.get("APP_PACKAGE", "").strip()
          cap = os.environ.get("ACCOUNT_CAP", "").strip()

          if not api_id.isdigit() or int(api_id) <= 0:
              sys.exit("Missing/invalid GitHub secret TELEGRAM_API_ID")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
              sys.exit("Missing/invalid GitHub secret TELEGRAM_API_HASH (must be 32 hex chars)")
          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", app_package):
              sys.exit("Invalid app_package input")
          if not cap.isdigit() or not 1 <= int(cap) <= 200:
              sys.exit("account_cap must be between 1 and 200")

          print("Configuration looks valid.")

      - name: Apply multi-account patch
        shell: bash
        run: |
          if grep -q "Custom multi-account build" TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java; then
