      - name: Apply app configuration
        shell: python
        run: |
          from pathlib import Path
          import json, os, re, sys

          api_id = int(os.environ["TELEGRAM_API_ID"].strip())
          api_hash = os.environ["TELEGRAM_API_HASH"].strip()
          app_name = os.environ["APP_NAME"].strip() or "MyChat"
          app_package = os.environ["APP_PACKAGE"].strip()
          cap = int(os.environ["ACCOUNT_CAP"].strip())

          def replace_required(path, pattern, repl, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              new, n = re.subn(pattern, repl, text, flags=re.M)
              if n == 0:
                  raise SystemExit(f"Could not update {label} in {path}")
              p.write_text(new, encoding="utf-8")

          # Telegram API credentials
          buildvars = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          text = buildvars.read_text(encoding="utf-8")
          text, n1 = re.subn(r"public static int APP_ID\s*=\s*\d+\s*;",
                             f"public static int APP_ID = {api_id};", text)
          text, n2 = re.subn(r'public static String APP_HASH\s*=\s*"[^"]*"\s*;',
                             f'public static String APP_HASH = "{api_hash}";', text)
          text = re.sub(r"public static boolean SUPPORTS_PASSKEYS\s*=\s*(true|false)\s*;",
                        "public static boolean SUPPORTS_PASSKEYS = false;", text)
          if not n1 or not n2:
              raise SystemExit("Could not configure BuildVars.java")
          buildvars.write_text(text, encoding="utf-8")

          # Package + GitHub runner JVM memory
          gp = Path("gradle.properties")
          text = gp.read_text(encoding="utf-8")
          text, n = re.subn(r"(?m)^APP_PACKAGE=.*$", f"APP_PACKAGE={app_package}", text)
          if not n:
              raise SystemExit("Could not set APP_PACKAGE in gradle.properties")
          text = re.sub(r"(?m)^org\.gradle\.jvmargs=.*$",
                        "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8", text)
          gp.write_text(text, encoding="utf-8")

          # Account cap (patch defaults to 100; input can lower/change it)
          replace_required(
              "TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java",
              r"public final static int MAX_ACCOUNT_COUNT\s*=\s*\d+\s*;",
              f"public final static int MAX_ACCOUNT_COUNT = {cap};",
              "Java account cap",
          )
          replace_required(
              "TMessagesProj/jni/tgnet/Defines.h",
              r"#define MAX_ACCOUNT_COUNT\s+\d+",
              f"#define MAX_ACCOUNT_COUNT {cap}",
              "native account cap",
          )

          # Change app display name in every locale that defines AppName.
          import xml.sax.saxutils as saxutils
          escaped = saxutils.escape(app_name)
          escaped_beta = saxutils.escape(app_name + " Beta")
          changed = 0
          for strings in Path("TMessagesProj/src/main/res").glob("values*/strings.xml"):
              s = strings.read_text(encoding="utf-8")
              ns = re.sub(r'<string name="AppName">.*?</string>',
                          f'<string name="AppName">{escaped}</string>', s)
              ns = re.sub(r'<string name="AppNameBeta">.*?</string>',
                          f'<string name="AppNameBeta">{escaped_beta}</string>', ns)
              if ns != s:
                  strings.write_text(ns, encoding="utf-8")
                  changed += 1
          print(f"Updated app name in {changed} locale file(s).")

          # Generate a build-only google-services.json matching our renamed package variants.
          # This makes the debug APK compile. For real Firebase/FCM push notifications,
          # replace it later with a google-services.json from your own Firebase project.
          def firebase_client(pkg, app_id_suffix):
              return {
                  "client_info": {
                      "mobilesdk_app_id": f"1:123456789012:android:{app_id_suffix}",
                      "android_client_info": {"package_name": pkg},
                  },
                  "oauth_client": [],
                  "api_key": [{"current_key": "AIzaSyDUMMY_KEY_FOR_DEBUG_BUILD_ONLY_123456"}],
                  "services": {
                      "appinvite_service": {
                          "other_platform_oauth_client": []
                      }
                  },
              }

          gs_data = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "debug-build-only",
                  "storage_bucket": "debug-build-only.appspot.com",
              },
              "client": [
                  # Original Telegram package IDs are still used by some shared/base modules.
                  firebase_client("org.telegram.messenger", "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"),
                  firebase_client("org.telegram.messenger.beta", "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"),
                  firebase_client("org.telegram.messenger.web", "cccccccccccccccccccccccccccccccc"),

                  # Custom application package IDs used by the standalone APK variants.
                  firebase_client(app_package, "00000000000000000000000000000000"),
                  firebase_client(app_package + ".beta", "11111111111111111111111111111111"),
                  firebase_client(app_package + ".web", "22222222222222222222222222222222"),
              ],
              "configuration_version": "1",
          }

          # Telegram keeps separate google-services.json files in multiple Android modules.
          # Write the same debug config to every module that contains one.
          google_service_targets = [
              Path("TMessagesProj/google-services.json"),
              Path("TMessagesProj_App/google-services.json"),
              Path("TMessagesProj_AppStandalone/google-services.json"),
              Path("TMessagesProj_AppHockeyApp/google-services.json"),
              Path("TMessagesProj_AppHuawei/google-services.json"),
          ]

          written = []
          payload = json.dumps(gs_data, indent=2)
          for gs in google_service_targets:
              if gs.parent.exists():
                  gs.write_text(payload, encoding="utf-8")
                  written.append(str(gs))

          print("Generated debug google-services.json for:", app_package, app_package + ".beta", app_package + ".web")
          print("Updated Google Services files:", written)

          print("App configuration applied.")

      - name: Verify standalone Firebase package entries
        shell: python
        run: |
          import json, os
          from pathlib import Path

          p = Path("TMessagesProj_AppStandalone/google-services.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          pkgs = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in data.get("client", [])
          ]
          required = {
              "org.telegram.messenger",
              "org.telegram.messenger.beta",
              "org.telegram.messenger.web",
              os.environ["APP_PACKAGE"],
              os.environ["APP_PACKAGE"] + ".beta",
              os.environ["APP_PACKAGE"] + ".web",
          }
          print("Standalone Firebase packages:", pkgs)
          missing = required.difference(pkgs)
          if missing:
              raise SystemExit(f"Missing Firebase package entries: {sorted(missing)}")

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        shell: bash
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK="$(find TMessagesProj_AppStandalone/build/outputs -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          mkdir -p dist
          SAFE_NAME="$(echo "$APP_NAME" | tr -cs 'A-Za-z0-9._-' '_')"
          cp "$APK" "dist/${SAFE_NAME}-debug.apk"
          echo "apk=dist/${SAFE_NAME}-debug.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-Android-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
