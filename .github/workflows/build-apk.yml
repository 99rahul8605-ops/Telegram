      - name: Apply app configuration
        shell: python
        run: |
          from pathlib import Path
          import json, os, re, sys

          api_id = int(os.environ["TELEGRAM_API_ID"].strip())
          api_hash = os.environ["TELEGRAM_API_HASH"].strip()
          app_name = os.environ["APP_NAME"].strip() or "MyChat"
          app_package = os.environ["APP_PACKAGE"].strip()
          cap = int(os.environ["ACCOUNT_CAP"].strip())

          def replace_required(path, pattern, repl, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              new, n = re.subn(pattern, repl, text, flags=re.M)
              if n == 0:
                  raise SystemExit(f"Could not update {label} in {path}")
              p.write_text(new, encoding="utf-8")

          # Telegram API credentials
          buildvars = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          text = buildvars.read_text(encoding="utf-8")
          text, n1 = re.subn(r"public static int APP_ID\s*=\s*\d+\s*;",
                             f"public static int APP_ID = {api_id};", text)
          text, n2 = re.subn(r'public static String APP_HASH\s*=\s*"[^"]*"\s*;',
                             f'public static String APP_HASH = "{api_hash}";', text)
          text = re.sub(r"public static boolean SUPPORTS_PASSKEYS\s*=\s*(true|false)\s*;",
                        "public static boolean SUPPORTS_PASSKEYS = false;", text)
          if not n1 or not n2:
              raise SystemExit("Could not configure BuildVars.java")
          buildvars.write_text(text, encoding="utf-8")

          # Package + GitHub runner JVM memory
          gp = Path("gradle.properties")
          text = gp.read_text(encoding="utf-8")
          text, n = re.subn(r"(?m)^APP_PACKAGE=.*$", f"APP_PACKAGE={app_package}", text)
          if not n:
              raise SystemExit("Could not set APP_PACKAGE in gradle.properties")
          text = re.sub(r"(?m)^org\.gradle\.jvmargs=.*$",
                        "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8", text)
          gp.write_text(text, encoding="utf-8")

          # Account cap (patch defaults to 100; input can lower/change it)
          replace_required(
              "TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java",
              r"public final static int MAX_ACCOUNT_COUNT\s*=\s*\d+\s*;",
              f"public final static int MAX_ACCOUNT_COUNT = {cap};",
              "Java account cap",
          )
          replace_required(
              "TMessagesProj/jni/tgnet/Defines.h",
              r"#define MAX_ACCOUNT_COUNT\s+\d+",
              f"#define MAX_ACCOUNT_COUNT {cap}",
              "native account cap",
          )

          # Change app display name in every locale that defines AppName.
          import xml.sax.saxutils as saxutils
          escaped = saxutils.escape(app_name)
          escaped_beta = saxutils.escape(app_name + " Beta")
          changed = 0
          for strings in Path("TMessagesProj/src/main/res").glob("values*/strings.xml"):
              s = strings.read_text(encoding="utf-8")
              ns = re.sub(r'<string name="AppName">.*?</string>',
                          f'<string name="AppName">{escaped}</string>', s)
              ns = re.sub(r'<string name="AppNameBeta">.*?</string>',
                          f'<string name="AppNameBeta">{escaped_beta}</string>', ns)
              if ns != s:
                  strings.write_text(ns, encoding="utf-8")
                  changed += 1
          print(f"Updated app name in {changed} locale file(s).")

          # Keep the checked-in dummy google-services.json buildable after package rename.
          # For real FCM notifications, replace this file with YOUR Firebase config later.
          gs = Path("TMessagesProj/google-services.json")
          if gs.exists():
              data = json.loads(gs.read_text(encoding="utf-8"))
              old_to_new = {
                  "org.telegram.messenger": app_package,
                  "org.telegram.messenger.beta": app_package + ".beta",
                  "org.telegram.messenger.web": app_package + ".web",
              }
              for client in data.get("client", []):
                  info = client.get("client_info", {}).get("android_client_info", {})
                  pkg = info.get("package_name")
                  if pkg in old_to_new:
                      info["package_name"] = old_to_new[pkg]
              gs.write_text(json.dumps(data, indent=2), encoding="utf-8")

          print("App configuration applied.")

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        shell: bash
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK="$(find TMessagesProj_AppStandalone/build/outputs -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          mkdir -p dist
          SAFE_NAME="$(echo "$APP_NAME" | tr -cs 'A-Za-z0-9._-' '_')"
          cp "$APK" "dist/${SAFE_NAME}-debug.apk"
          echo "apk=dist/${SAFE_NAME}-debug.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-Android-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
